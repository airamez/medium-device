<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f0e4"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1500" height="1000" fill="#0f172a"/>
  <rect x="20" y="20" width="1460" height="960" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <text x="750" y="56" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Circular needle device — part map</text>
  <text x="750" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Item codes match the items list (E = electronics, M = mechanics)</text>

  <!-- TOP VIEW -->
  <g transform="translate(360, 400)">
    <circle cx="5" cy="7" r="215" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="0" r="215" fill="url(#wood)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="200" fill="url(#face)" stroke="#8b7355" stroke-width="2"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">
      <text x="0" y="-170" text-anchor="middle">A</text>
      <text x="85" y="-148" text-anchor="middle">D</text>
      <text x="150" y="-82" text-anchor="middle">G</text>
      <text x="175" y="0" text-anchor="middle">J</text>
      <text x="150" y="82" text-anchor="middle">M</text>
      <text x="85" y="148" text-anchor="middle">P</text>
      <text x="0" y="175" text-anchor="middle">S</text>
      <text x="-85" y="148" text-anchor="middle">V</text>
      <text x="-150" y="82" text-anchor="middle">Y</text>
      <text x="-175" y="0" text-anchor="middle" fill="#0f766e">1</text>
      <text x="-150" y="-82" text-anchor="middle" fill="#0f766e">4</text>
      <text x="-85" y="-148" text-anchor="middle" fill="#0f766e">7</text>
    </g>

    <line x1="-30" y1="-18" x2="132" y2="76" stroke="#5c4033" stroke-width="5" stroke-linecap="round"/>
    <polygon points="142,82 122,87 125,72" fill="#1c1917"/>
    <circle cx="-38" cy="-22" r="9" fill="#57534e"/>
    <circle cx="0" cy="0" r="12" fill="#44403c" stroke="#a8a29e" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#d6d3d1"/>

    <text x="0" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">TOP VIEW</text>

    <line x1="145" y1="-165" x2="200" y2="-195" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="200" y="-212" width="54" height="26" rx="6" fill="#422006" stroke="#fbbf24"/>
    <text x="227" y="-194" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">M04</text>

    <line x1="110" y1="65" x2="175" y2="105" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="175" y="92" width="54" height="26" rx="6" fill="#422006" stroke="#fbbf24"/>
    <text x="202" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">M03</text>

    <line x1="-38" y1="-22" x2="-100" y2="-65" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="-156" y="-78" width="54" height="26" rx="6" fill="#422006" stroke="#fbbf24"/>
    <text x="-129" y="-60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a">M05</text>

    <line x1="8" y1="8" x2="65" y2="42" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="65" y="28" width="72" height="26" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="101" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd">M01</text>
  </g>

  <!-- SIDE STACK -->
  <g transform="translate(780, 110)">
    <text x="200" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">SIDE VIEW — center stack</text>

    <!-- M03 -->
    <rect x="150" y="55" width="120" height="10" rx="2" fill="#5c4033"/>
    <polygon points="270,60 286,55 286,65" fill="#2c1810"/>
    <circle cx="162" cy="60" r="7" fill="#57534e"/>
    <rect x="20" y="48" width="48" height="24" rx="6" fill="#422006" stroke="#fbbf24"/>
    <text x="44" y="65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a">M03</text>
    <text x="310" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Needle</text>

    <!-- M02 shaft -->
    <rect x="189" y="65" width="12" height="155" rx="1" fill="#94a3b8"/>
    <rect x="20" y="115" width="48" height="24" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="44" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd">M02</text>
    <text x="310" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Shaft</text>

    <!-- M01 bearing -->
    <rect x="164" y="105" width="62" height="46" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="189" y="105" width="12" height="46" fill="#94a3b8"/>
    <circle cx="195" cy="128" r="16" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="20" y="160" width="48" height="24" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="44" y="177" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd">M01</text>
    <text x="310" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Ball bearing</text>

    <!-- M04 base -->
    <rect x="85" y="150" width="220" height="14" rx="2" fill="url(#wood)"/>
    <rect x="20" y="200" width="48" height="24" rx="6" fill="#422006" stroke="#fbbf24"/>
    <text x="44" y="217" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a">M04</text>
    <text x="310" y="217" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Wood base</text>

    <!-- shaft tip -->
    <rect x="189" y="215" width="12" height="12" fill="#cbd5e1"/>

    <!-- E03 magnet on end - solid disc, not pierced by continuing shaft -->
    <ellipse cx="195" cy="238" rx="26" ry="7" fill="#b91c1c" stroke="#fca5a5"/>
    <rect x="169" y="238" width="52" height="14" fill="#dc2626"/>
    <ellipse cx="195" cy="252" rx="26" ry="7" fill="#991b1b" stroke="#fca5a5"/>
    <text x="195" y="249" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">N │ S</text>
    <rect x="20" y="235" width="48" height="24" rx="6" fill="#7f1d1d" stroke="#f87171"/>
    <text x="44" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fecaca">E03</text>
    <text x="310" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Diametric magnet</text>

    <!-- air gap -->
    <line x1="230" y1="260" x2="230" y2="285" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="240" y="277" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">1–3 mm</text>

    <!-- E01 -->
    <rect x="150" y="288" width="90" height="40" rx="4" fill="#166534" stroke="#4ade80" stroke-width="2"/>
    <text x="195" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">AS5600</text>
    <text x="195" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#86efac">angle sensor</text>
    <rect x="20" y="296" width="48" height="24" rx="6" fill="#14532d" stroke="#4ade80"/>
    <text x="44" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bbf7d0">E01</text>
    <text x="310" y="313" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">AS5600 module</text>

    <!-- E04 wires -->
    <path d="M195,328 C160,345 120,360 120,390" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <path d="M195,328 C230,345 270,360 270,390" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <rect x="20" y="370" width="48" height="24" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="44" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ddd6fe">E04</text>
    <text x="310" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Jumper wires</text>

    <!-- E02 -->
    <rect x="140" y="405" width="110" height="46" rx="4" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
    <text x="195" y="426" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#dbeafe">Nano</text>
    <text x="195" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#bfdbfe">Arduino</text>
    <rect x="20" y="416" width="48" height="24" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="44" y="433" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bfdbfe">E02</text>
    <text x="310" y="433" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Arduino Nano</text>

    <!-- E05 -->
    <rect x="140" y="465" width="110" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 2"/>
    <text x="195" y="481" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#475569">breadboard</text>
    <rect x="20" y="465" width="48" height="24" rx="6" fill="#334155" stroke="#94a3b8"/>
    <text x="44" y="482" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">E05</text>
    <text x="310" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">Breadboard</text>

    <!-- E06 -->
    <path d="M195,451 L195,520 L280,520" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <rect x="280" y="508" width="48" height="24" rx="4" fill="#0f172a" stroke="#94a3b8"/>
    <text x="304" y="524" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0">PC</text>
    <rect x="20" y="508" width="48" height="24" rx="6" fill="#334155" stroke="#94a3b8"/>
    <text x="44" y="525" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">E06</text>
    <text x="340" y="525" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">USB cable</text>
  </g>

  <!-- LEGEND -->
  <g transform="translate(50, 700)">
    <rect x="0" y="0" width="1400" height="250" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Items</text>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      <text x="24" y="58" fill="#4ade80" font-weight="700">E01</text>
      <text x="70" y="58" fill="#cbd5e1">AS5600 — reads magnet angle</text>
      <text x="24" y="82" fill="#60a5fa" font-weight="700">E02</text>
      <text x="70" y="82" fill="#cbd5e1">Arduino Nano — sends angles to PC</text>
      <text x="24" y="106" fill="#f87171" font-weight="700">E03</text>
      <text x="70" y="106" fill="#cbd5e1">Diametric magnet — on shaft end, turns with needle</text>
      <text x="24" y="130" fill="#a78bfa" font-weight="700">E04</text>
      <text x="70" y="130" fill="#cbd5e1">Jumper wires — E01 to E02</text>
      <text x="24" y="154" fill="#94a3b8" font-weight="700">E05</text>
      <text x="70" y="154" fill="#cbd5e1">Breadboard — temporary wiring</text>
      <text x="24" y="178" fill="#94a3b8" font-weight="700">E06</text>
      <text x="70" y="178" fill="#cbd5e1">USB cable — Nano to PC</text>

      <text x="520" y="58" fill="#38bdf8" font-weight="700">M01</text>
      <text x="566" y="58" fill="#cbd5e1">Ball bearing — low-friction pivot</text>
      <text x="520" y="82" fill="#38bdf8" font-weight="700">M02</text>
      <text x="566" y="82" fill="#cbd5e1">Shaft — axle for needle and magnet</text>
      <text x="520" y="106" fill="#fbbf24" font-weight="700">M03</text>
      <text x="566" y="106" fill="#cbd5e1">Balsa needle — pointer over letters</text>
      <text x="520" y="130" fill="#fbbf24" font-weight="700">M04</text>
      <text x="566" y="130" fill="#cbd5e1">Wood base — board with letter ring</text>
      <text x="520" y="154" fill="#fbbf24" font-weight="700">M05</text>
      <text x="566" y="154" fill="#cbd5e1">Glue (M05a) + screws/nuts (M05b)</text>
      <text x="520" y="178" fill="#e2e8f0" font-weight="700">PC</text>
      <text x="566" y="178" fill="#cbd5e1">Python app — characters and logs</text>
    </g>

    <text x="24" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Flow: M03 moves → M02 and E03 turn → E01 measures angle → E02 sends over E06 → PC prints character when needle settles</text>
  </g>
</svg>
